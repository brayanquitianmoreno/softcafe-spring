# Configuración general de SoftCafé
spring.application.name=SoftCafe

# La contraseña se configura en la variable de entorno DB_PASSWORD.
# No guardar contraseñas reales dentro del repositorio.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/softcafe?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Thymeleaf (se conserva la interfaz anterior)
spring.thymeleaf.cache=false

# Puerto del backend
server.port=8080
