
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de productos | SoftCafé</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1eb;
            margin: 0;
            padding: 30px;
            color: #3e2723;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            color: #6f4e37;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .boton {
            display: inline-block;
            background: #6f4e37;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .volver {
            background: #777;
            margin-left: 8px;
        }

        .error {
            color: #b93226;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1 th:text="${titulo}">Registrar producto</h1>

    <form th:action="@{/productos/guardar}"
          th:object="${producto}"
          method="post">

        <!-- Conserva el identificador cuando se edita un producto. -->
        <input type="hidden" th:field="*{id}">

        <label for="codigo">Código del producto:</label>
        <input type="text" id="codigo" th:field="*{codigo}"
               placeholder="Ejemplo: CAF-005" required>
        <small class="error" th:errors="*{codigo}"></small>

        <label for="nombre">Nombre del producto:</label>
        <input type="text" id="nombre" th:field="*{nombre}"
               placeholder="Nombre del producto" required>
        <small class="error" th:errors="*{nombre}"></small>

        <label for="precio">Precio:</label>
        <input type="number" id="precio" th:field="*{precio}"
               min="0.01" step="0.01" placeholder="8000" required>
        <small class="error" th:errors="*{precio}"></small>

        <label for="stock">Cantidad disponible:</label>
        <input type="number" id="stock" th:field="*{stock}"
               min="0" placeholder="20" required>
        <small class="error" th:errors="*{stock}"></small>

        <button type="submit" class="boton">Guardar producto</button>

        <a th:href="@{/productos}" class="boton volver">Cancelar</a>

    </form>

</div>

</body>
</html>
